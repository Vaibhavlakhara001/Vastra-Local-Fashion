<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VASTRA – Local Fashion Marketplace | Har Local Dukaan, Ab Online</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">

  <!-- Google Fonts: Playfair Display (Serif) & Plus Jakarta Sans (Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            cream: {
              50: '#FDFBF7',
              100: '#FAF7F2',
              200: '#F3ECE2',
              300: '#E7D8C9'
            },
            terracotta: {
              DEFAULT: '#C2410C',
              50: '#FFF7ED',
              600: '#C2410C',
              700: '#9A3412',
              800: '#7C2D12'
            },
            maroon: {
              DEFAULT: '#831843',
              600: '#9D174D',
              700: '#831843',
              800: '#701A75',
              900: '#500724'
            },
            charcoal: {
              DEFAULT: '#18181B',
              800: '#27272A',
              900: '#18181B',
              950: '#09090B'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F3ECE2;
    }
    ::-webkit-scrollbar-thumb {
      background: #D7CCC0;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9A3412;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <!-- React 18 & ReactDOM 18 with CDN Fallbacks -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>');
    }
  </script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>
    if (!window.ReactDOM) {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <script>
    // Global Safety Net & Self-Healing
    window.addEventListener('error', function(e) {
      console.warn('VASTRA Global Error Caught:', e.message);
      var root = document.getElementById('root');
      if (root && root.innerHTML.indexOf('Connecting Local Fashion Stores...') !== -1) {
        root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;font-family:sans-serif;background:#FAF7F2;">' +
          '<div style="max-width:440px;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.08);text-align:center;border:1px solid #e5e0d8;">' +
          '<div style="font-size:32px;margin-bottom:12px;">🛍️</div>' +
          '<h2 style="font-size:20px;font-weight:bold;color:#18181b;margin-bottom:8px;">VASTRA Marketplace</h2>' +
          '<p style="font-size:13px;color:#71717a;margin-bottom:16px;">We noticed an issue loading your saved local session.</p>' +
          '<button onclick="localStorage.clear();location.reload();" style="background:#c2410c;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px;">Reset Local Data & Reload</button>' +
          '</div></div>';
      }
    });
  </script>
</head>
<body class="bg-[#FAF7F2] text-stone-900 min-h-screen">
  <div id="root">
    <!-- Fallback loader while script boots -->
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 border-4 border-orange-800 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <div class="font-serif text-xl font-bold text-stone-900 tracking-wider">VASTRA</div>
        <p class="text-xs text-stone-500 font-medium">Connecting Local Fashion Stores...</p>
      </div>
    </div>
  </div>

  <!-- Application Modular Scripts -->
  <script src="./data.js"></script>
  <script src="./store.js"></script>
  <script src="./icons.js"></script>
  <script src="./components.js"></script>
  <script src="./views.js"></script>
  <script src="./pages.js"></script>
  <script src="./dashboards.js"></script>
  <script src="./informational.js"></script>
  <script src="./app.js"></script>
</body>
</html>
